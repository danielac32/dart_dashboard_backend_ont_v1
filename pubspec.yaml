name: dart_dashboard_backend_ont_v1
description: A sample command-line application.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.7.2

# Add regular dependencies here.
dependencies:
  alfred: ^1.1.2+1
  analyzer: ^7.4.5
  build_runner: ^2.4.15
  dart_jsonwebtoken: ^3.2.0
  dart_odbc: ^4.2.0+1
  meta: ^1.17.0
  objectbox: ^4.2.0
  objectbox_generator: ^4.2.0
  postgres: ^3.5.6
  source_gen: ^2.0.0
  uuid: ^4.5.1
  # path: ^1.8.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

targets:
  $default:
    builders:
      dart_dashboard_backend_ont_v1|routeGenerator:
        enabled: true

builders:
  routeGenerator:
    import: "package:dart_dashboard_backend_ont_v1/generator/generator_route.dart"
    builder_factories: ["routeGenerator"]
    build_extensions: { ".dart": [".g.dart"] }
    auto_apply: root_package
    default_options: {}